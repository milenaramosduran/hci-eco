<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpinGO - Ride Smart, Ride Safe</title>
    
    <!-- NOTA: Tailwind via CDN va bene per test, ma in produzione sarebbe meglio installarlo. 
         Per ora lo lasciamo così funziona subito. -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&display=swap" rel="stylesheet">
    
    <style>
      body { font-family: 'Inter', sans-serif; }
      .font-display { font-family: 'Playfair Display', serif; }
      .text-fill-image {
        -webkit-text-fill-color: transparent;
        -webkit-background-clip: text;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      @media (hover: hover) and (pointer: fine) {
          body, a, button, input, textarea, select, [role="button"] {
              cursor: none !important;
          }
      }
    </style>
    
    <!-- RIMOSSO IMPORT MAP: Vite gestisce le dipendenze automaticamente -->
    
    <!-- AGGIUNTO IL PUNTO PRIMA DELLO SLASH -->
    <!-- Se index.css esiste nella cartella principale, va bene, altrimenti
         di solito si importa direttamente dentro index.tsx -->
    <!-- <link rel="stylesheet" href="./index.css"> -->
  </head>
  <body class="bg-[#FDFDF9] text-black antialiased">
    <div id="root"></div>
    
    <!-- CORRETTO: Aggiunto il punto (.) prima dello slash per renderlo relativo -->
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
